<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple To-Do app">
    <title>Task-Up</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <div class="container">
            <div class="main-container mx-auto p-4">
                <header class="text-center">
                    <time class="fw-bold fs-5 text-muted text-uppercase" id="current-date"></time>
                </header>

                <hr class="divider">

                <section aria-labelledby="add-task-heading">
                    <h2 id="add-task-heading" class="visually-hidden">Add a Task</h2>

                    <form class="add-task-form" id="add-task-form">
                        <div class="d-flex gap-2">
                            <label for="task-input" class="visually-hidden">Task</label>
                            <input type="text" class="form-control" id="task-input" name="task-input"
                                placeholder="Add task">
                            <button type="submit" class="btn btn-primary">Add</button>
                        </div>
                    </form>
                </section>

                <section aria-labelledby="task-list-section" class="mt-4">
                    <h2 id="task-list-heading" class="fs-5 fw-bold text-muted">Tasks</h2>

                    <div class="ms-3" id="task-list">
                    </div>
                </section>
            </div>
        </div>

    </main>

    <script>
        const currentDate = new Date()
        const dateElement = document.getElementById( "current-date" );
        dateElement.dateTime = currentDate.toISOString().split( "T" )[ 0 ];
        dateElement.textContent = currentDate.toLocaleDateString( "en-PH", {
            month: "long",
            day: "2-digit",
            year: "numeric"
        } );

        let tasks = JSON.parse( localStorage.getItem( "tasks" ) ) ?? []
        const taskInput = document.querySelector( "#task-input" )
        const taskForm = document.querySelector( "#add-task-form" )
        const taskList = document.querySelector( "#task-list" )

        const renderTasks = () => {
            taskInput.value = ""
            taskList.innerHTML = ""
            tasks.map( ( taskData ) => {
                const taskItem = document.createElement( "div" )
                taskItem.classList.add( [
                    "task-item", "d-flex", "align-items-center", "mb-2"
                ] )
                const { id, task, isCompleted } = taskData
                taskItem.innerHTML = `
                    <input class="form-check-input task-checkbox" type="checkbox" id="task-${ id }-checkbox" data-id="${ id }" ${ isCompleted ? 'checked' : '' }>
                    <label class="form-check-label fw-medium text-muted text-break ms-1" id="task-${ id }" for="task-${ id }-checkbox">${ task }</label>
                `

                taskList.appendChild( taskItem )
            } )
        }

        // Listener when a user inputs a new task and click add/enter
        taskForm.addEventListener( 'submit', () => {
            event.preventDefault();

            const task = taskInput.value.trim();
            const taskData = {
                id: tasks.length + 1,
                task: task,
                isCompleted: false
            }
            tasks.push( taskData );
            localStorage.setItem( "tasks", JSON.stringify( tasks ) );

            // Render the tasks after saving the new task on local storage
            renderTasks();
        } )

        // Checkbox functionality
        taskList.addEventListener( 'change', ( event ) => {
            if ( !event.target.classList.contains( 'task-checkbox' ) ) {
                return;
            }

            const checkbox = event.target;
            const id = checkbox.dataset.id;
            const isCompleted = checkbox.checked;

            // Updating the local storage when checkbox state has changed
            let tasks = JSON.parse( localStorage.getItem( 'tasks' ) ) || [];
            const task = tasks.find( ( task ) => task.id === Number( id ) );

            if ( task ) {
                // If checkbox is clicked remove it on the array before saving on local storage
                tasks = tasks.filter( ( t ) => t.id !== task.id )
            }

            localStorage.setItem( 'tasks', JSON.stringify( tasks ) );
            window.location.reload()
            return
        } );

        // Render the tasks saved on local storage
        renderTasks();
    </script>
</body>

</html>
